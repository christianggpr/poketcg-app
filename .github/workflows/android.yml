name: App Android (APK)

# Construye y firma la app Android (Trusted Web Activity de https://poketcg.pe) y deja el APK en
# public/descargas/ para que la web lo ofrezca. Se ejecuta al cambiar android/twa-manifest.json
# (por ejemplo, al subir la versión) o a mano desde la pestaña Actions → "Run workflow".
# Necesita dos secretos del repositorio: ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD.

on:
  push:
    branches: [main]
    paths: ['android/twa-manifest.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Comprobar secretos
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y/o ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Preparar JDK 17 y Android SDK del runner
        run: |
          echo "JDK: $JAVA_HOME_17_X64"; echo "SDK: $ANDROID_SDK_ROOT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "build-tools;36.1.0" "platforms;android-36" "platform-tools" > /dev/null
          # Bubblewrap espera <sdk>/bin/sdkmanager (o <sdk>/tools): se arma una carpeta con enlaces al SDK del runner
          SDK_BW="$HOME/android-sdk"; mkdir -p "$SDK_BW"
          for d in "$ANDROID_SDK_ROOT"/*; do ln -sfn "$d" "$SDK_BW/$(basename "$d")"; done
          ln -sfn "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" "$SDK_BW/bin"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME_17_X64" "$SDK_BW" > ~/.bubblewrap/config.json
          echo "ANDROID_HOME=$SDK_BW" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_BW" >> "$GITHUB_ENV"

      - name: Restaurar la clave de firma
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > poketcg-android.keystore

      - name: Generar el proyecto Android
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json

      - name: Construir y firmar el APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json

      - name: Copiar el APK a la web
        run: |
          mkdir -p public/descargas
          cp android/app-release-signed.apk public/descargas/poketcg.apk
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("android/twa-manifest.json", "utf8"));
            const apk = fs.readFileSync("public/descargas/poketcg.apk");
            fs.writeFileSync("public/descargas/android.json", JSON.stringify({ version: m.appVersionName || m.appVersion, codigo: m.appVersionCode, bytes: apk.length, sha256: crypto.createHash("sha256").update(apk).digest("hex"), fecha: new Date().toISOString().slice(0, 10), paquete: m.packageId }, null, 2) + "\n");
          '
          rm -f android/poketcg-android.keystore
          cat public/descargas/android.json

      - name: Publicar el APK en el repositorio (Vercel lo despliega)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/descargas/poketcg.apk public/descargas/android.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          V=$(node -e 'console.log(require("./public/descargas/android.json").version)')
          git commit -m "App Android v$V (APK firmado) [actions]"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: poketcg-android
          path: |
            public/descargas/poketcg.apk
            public/descargas/android.json
            android/app-release-bundle.aab
          if-no-files-found: warn
